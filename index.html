<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ChatApp</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="profile">

                    <div class="avatar">
                        👤
                    </div>

                    <div>
                        <strong>Nama Saya</strong>
                        <span>Online</span>
                    </div>

                </div>

                <button>⋮</button>

            </div>


            <div class="search">

                🔍

                <input
                    type="text"
                    placeholder="Cari chat">

            </div>


            <div class="chat-list">

                <div class="chat">

                    <div class="avatar">
                        👨
                    </div>

                    <div>

                        <strong>Andi</strong>

                        <p>Halo 👋</p>

                    </div>

                </div>


                <div class="chat">

                    <div class="avatar">
                        👩
                    </div>

                    <div>

                        <strong>Siti</strong>

                        <p>Besok jadi pergi?</p>

                    </div>

                </div>


                <div class="chat">

                    <div class="avatar">
                        👦
                    </div>

                    <div>

                        <strong>Budi</strong>

                        <p>Oke 👍</p>

                    </div>

                </div>

            </div>

        </aside>


        <!-- CHAT -->

        <main class="chat-area">

            <header class="chat-header">

                <div class="profile">

                    <div class="avatar">
                        👨
                    </div>

                    <div>

                        <strong>Andi</strong>

                        <span>online</span>

                    </div>

                </div>

                <div>

                    <button>🔍</button>

                    <button>⋮</button>

                </div>

            </header>


            <div class="messages">

                <div class="message received">

                    Halo 👋

                    <small>
                        08:30
                    </small>

                </div>


                <div class="message sent">

                    Hai! Apa kabar?

                    <small>
                        08:31 ✓✓
                    </small>

                </div>


                <div class="message received">

                    Aku baik 👍

                    <small>
                        08:31
                    </small>

                </div>

            </div>

<div class="message-box">

    <button>😀</button>

    <button>📎</button>

    <input
        type="text"
        placeholder="Ketik pesan">

    <button id="sendButton">➤</button>

</div>

        </main>

    </div>
<script src="script.js"></script>
</body>

</html>
